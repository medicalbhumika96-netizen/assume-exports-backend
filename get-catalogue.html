<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Get Catalogue | Assume Exports</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>

    <header class="site-header">
        <div class="container nav">

            <a href="index.html" class="brand">
                <div>
                    <strong>ASSUME</strong>
                    <small>LIGHTING & HOME DÉCOR</small>
                </div>
            </a>

            <nav>
                <a href="index.html">Home</a>
                <a href="catalog.html?category=furniture">Products</a>
                <a href="index.html#about">About</a>
                <a href="index.html#contact">Contact</a>
            </nav>

        </div>
    </header>

    <section class="catalogue-hero">
        <div class="container catalogue-hero-content">

            <p class="catalogue-breadcrumb">Home › Get Catalogue</p>

            <h1>Get Catalogue</h1>

            <p>
                Select the product categories you are interested in and receive
                the relevant catalogue from our team.
            </p>

        </div>
    </section>

    <section class="catalogue-form-section">
        <div class="container">

            <form class="catalogue-request-form" id="catalogueForm">

                <div class="catalogue-block">
                    <h3>1. Select Categories</h3>

                    <div class="catalogue-category-grid">

                        <div class="catalogue-category-box">
                            <label class="main-check">
                                <input type="checkbox" name="category" value="Lighting">
                                <span>💡</span>
                                <strong>Lighting</strong>
                            </label>

                            <label><input type="checkbox" name="subcategory" value="Table Lamps"> Table Lamps</label>
                            <label><input type="checkbox" name="subcategory" value="Floor Lamps"> Floor Lamps</label>
                            <label><input type="checkbox" name="subcategory" value="Wall Lamps"> Wall Lamps</label>
                            <label><input type="checkbox" name="" value="Hanging Lamps"> Hanging
                                Lamps</label>
                        </div>

                        <div class="catalogue-category-box">
                            <label class="main-check">
                                <input type="checkbox" name="category" value="Furniture">
                                <span>🪑</span>
                                <strong>Furniture</strong>
                            </label>

                            <label><input type="checkbox" name="subcategory" value="Coffee Tables"> Coffee
                                Tables</label>
                            <label><input type="checkbox" name="subcategory" value="Side Tables"> Side Tables</label>
                            <label><input type="checkbox" name="subcategory" value="Console Tables"> Console
                                Tables</label>
                            <label><input type="checkbox" name="subcategory" value="Dining Tables"> Dining
                                Tables</label>
                            <label><input type="checkbox" name="subcategory" value="Stools"> Stools</label>
                        </div>

                        <div class="catalogue-category-box">
                            <label class="main-check">
                                <input type="checkbox" name="category" value="Home Decor">
                                <span>🏺</span>
                                <strong>Home Décor</strong>
                            </label>

                            <label><input type="checkbox" name="subcategory" value="Vases & Planters"> Vases &
                                Planters</label>
                            <label><input type="checkbox" name="subcategory" value="Wooden Artifacts"> Wooden
                                Artifacts</label>
                            <label><input type="checkbox" name="subcategory" value="Mirrors"> Mirrors</label>
                            <label><input type="checkbox" name="subcategory" value="Candle Holders"> Candle
                                Holders</label>
                            <label><input type="checkbox" name="subcategory" value="Wall Decor"> Wall Decor</label>
                        </div>

                    </div>
                </div>

                <div class="catalogue-info-grid">

                    <div class="catalogue-block">
                        <h3>2. Buyer Information</h3>

                        <div class="form-group">
                            <label>Full Name *</label>
                            <input type="text" id="fullName" placeholder="Enter your full name" required>
                        </div>

                        <div class="form-group">
                            <label>Company Name *</label>
                            <input type="text" id="companyName" placeholder="Enter your company name" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Country *</label>
                                <select id="country" required>
                                    <option value="">Select your country</option>
                                    <option>India</option>
                                    <option>USA</option>
                                    <option>UK</option>
                                    <option>Germany</option>
                                    <option>UAE</option>
                                    <option>Other</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Email Address *</label>
                                <input type="email" id="email" placeholder="Enter email address" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>WhatsApp / Phone Number *</label>
                            <input type="text" id="phone" placeholder="+91 Enter your number" required>
                        </div>

                        <div class="form-group">
                            <label>Website</label>
                            <input type="text" id="website" placeholder="Enter your website">
                        </div>
                    </div>

                    <div class="catalogue-block">
                        <div class="form-group catalogue-notes">
                            <label>4. Additional Notes</label>
                            <textarea id="additionalNotes" rows="6"
                                placeholder="Tell us more about your requirement, target market, preferred style, quantity range or any other details."></textarea>
                        </div>
                    </div>

                </div>

                <div class="catalogue-submit">
                    <button type="submit" class="btn primary" id="submitBtn">
                        Request Catalogue →
                    </button>

                    <p>🔒 Your information is safe and secure with us.</p>
                </div>

            </form>

        </div>
    </section>

    <script>
        const API_URL = "https://assume-exports-backend.onrender.com/api/catalogue";

        const form = document.getElementById("catalogueForm");

        form.addEventListener("submit", async function (e) {
            e.preventDefault();

            const submitBtn = document.getElementById("submitBtn");

            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";

            try {
                const categories = Array.from(
                    document.querySelectorAll('input[name="category"]:checked')
                ).map(el => el.value);

                const subcategories = Array.from(
                    document.querySelectorAll('input[name="subcategory"]:checked')
                ).map(el => el.value);

                const data = {
                    categories,
                    subcategories,
                    fullName: document.getElementById("fullName").value,
                    companyName: document.getElementById("companyName").value,
                    country: document.getElementById("country").value,
                    email: document.getElementById("email").value,
                    phone: document.getElementById("phone").value,
                    website: document.getElementById("website").value,
                    additionalNotes: document.getElementById("additionalNotes").value
                };

                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    alert("Catalogue request submitted successfully!");
                    form.reset();
                } else {
                    alert("Submission failed");
                }

            } catch (error) {
                console.log(error);
                alert("Server error. Please try again.");

            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Request Catalogue →";
            }
        });
    </script>

</body>

</html>
