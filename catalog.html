<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Product Catalog | Assume Exports</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>

  <header class="site-header">
    <div class="container nav">

      <a href="index.html" class="brand">
        <div>
          <strong>ASSUME</strong>
          <small>LIGHTING & HOME DÉCOR</small>
        </div>
      </a>

      <nav>
        <a href="index.html">Home</a>
        <a href="index.html#categoryGrid">Products</a>
        <a href="index.html#about">About</a>
        <a href="index.html#market">Market</a>
        <a href="index.html#contact">Contact</a>
      </nav>

    </div>
  </header>

  <!-- CATEGORY HERO -->
  <section class="catalog-hero" id="catalogHero">
    <div class="catalog-hero-overlay"></div>

    <div class="container catalog-hero-content">
      <p class="catalog-breadcrumb">
        <span id="breadcrumbCategory">Category</span>
      </p>

      <h1 id="catalogTitle">Lighting</h1>

      <p id="catalogDesc">
        Explore our premium handcrafted collection.
      </p>
    </div>
  </section>

  <!-- SUB CATEGORY VIEW -->
  <section class="section" id="subcategorySection">
    <div class="container">

      <div class="catalog-section-title">
        <h2 id="subcategoryHeading">Explore Categories</h2>
      </div>

      <div class="subcategory-grid" id="subcategoryGrid"></div>

    </div>
  </section>

  <!-- PRODUCT LIST VIEW -->
  <section class="section product-list-section" id="productListSection" style="display:none;">
    <div class="container catalog-layout">

      <aside class="catalog-sidebar">

        <h2 id="sidebarTitle">Lighting</h2>

        <p id="sidebarDesc">
          Discover our premium products.
        </p>

        <div class="filter-box">
          <h4>Categories</h4>
          <div id="sidebarCategories"></div>
        </div>

      </aside>

      <main class="catalog-products-area">

        <div class="catalog-toolbar">
          <p id="resultCount">Showing products</p>

          <select>
            <option>Sort by: Newest</option>
            <option>Sort by: Popular</option>
            <option>Sort by: Name</option>
          </select>
        </div>

        <div class="catalog-product-grid" id="catalogGrid"></div>

      </main>

    </div>
  </section>

  <script src="assets/js/dynamic-products.js"></script>
  <script src="assets/js/main.js"></script>

</body>

</html>
